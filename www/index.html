<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2E6A4D">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>

<body>
<title>HabitFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Unbounded:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: app de una columna para celular, barra de pestañas fija abajo, tarjetas solo para los hábitos */
:root{
  --bg:#F2F4F0; --surface:#FFFFFF; --surface-2:#E7EBE4; --fg:#16201A; --muted:#5D6B62; --line:#D5DCD2;
  --accent:#2E6A4D; --accent-fg:#FFFFFF; --accent-soft:#D6E7DC;
  --spark:#D99A1E; --spark-soft:#F6E7C4;
  --ok:#2E7D4F; --warn:#B7791F; --bad:#B23A3A;
  --heat0:#E3E8E0; --heat1:#B9D6C3; --heat2:#7FB597; --heat3:#4A9270; --heat4:#2E6A4D;
  --f-display:"Unbounded", "Arial Black", system-ui, sans-serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1512; --surface:#18211C; --surface-2:#222D27; --fg:#E6EDE8; --muted:#94A39A; --line:#2C3832;
  --accent:#5DB88A; --accent-fg:#0C1510; --accent-soft:#1F3A2D;
  --spark:#F0B540; --spark-soft:#3A2F17;
  --ok:#5DB88A; --warn:#E0A94A; --bad:#E07070;
  --heat0:#222D27; --heat1:#244536; --heat2:#2F6A4D; --heat3:#45966C; --heat4:#6BC996;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1512; --surface:#18211C; --surface-2:#222D27; --fg:#E6EDE8; --muted:#94A39A; --line:#2C3832;
  --accent:#5DB88A; --accent-fg:#0C1510; --accent-soft:#1F3A2D;
  --spark:#F0B540; --spark-soft:#3A2F17;
  --ok:#5DB88A; --warn:#E0A94A; --bad:#E07070;
  --heat0:#222D27; --heat1:#244536; --heat2:#2F6A4D; --heat3:#45966C; --heat4:#6BC996;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:12px calc(92px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--f-display);font-weight:700;font-size:1.35rem;letter-spacing:-.01em}
h2{font-size:1.05rem;font-weight:700}
.eyebrow{font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.banner{background:var(--spark-soft);border-radius:var(--r);padding:12px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:.92rem}
.btn{border:0;border-radius:999px;padding:10px 16px;font-weight:600;background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-fg)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.small{padding:6px 12px;font-size:.88rem}
.btn.danger{background:transparent;color:var(--bad);border:1px solid currentColor}
.btn:disabled{opacity:.45;cursor:not-allowed}
.seg{display:flex;background:var(--surface-2);border-radius:999px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;border-radius:999px;padding:8px 6px;font-weight:600;font-size:.9rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.08)}
/* Hoy */
.today-head{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.ring{width:92px;height:92px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .lbl{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:1.1rem}
.streak{display:flex;align-items:baseline;gap:8px}
.streak b{font-family:var(--f-display);font-size:2rem;color:var(--spark);line-height:1}
.habit{background:var(--surface);border-radius:var(--r);padding:12px 12px 12px 14px;display:flex;align-items:center;gap:12px;border:1px solid var(--line)}
.habit .info{flex:1;min-width:0}
.habit .name{font-weight:600;overflow-wrap:anywhere}
.habit .meta{font-size:.82rem;color:var(--muted)}
.habit.done .name{text-decoration:line-through;text-decoration-color:var(--muted)}
.check{width:48px;height:48px;border-radius:50%;border:2px solid var(--line);background:transparent;display:grid;place-items:center;flex:none;transition:transform .12s}
.check svg{width:22px;height:22px;opacity:0}
.habit.done .check{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.habit.done .check svg{opacity:1}
.check:active{transform:scale(.9)}
.cat{display:inline-block;font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--fg)}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;color:var(--muted)}
/* Progreso */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.stat b{display:block;font-family:var(--f-display);font-size:1.3rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.78rem;color:var(--muted)}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.heat .dow{font-size:.7rem;text-align:center;color:var(--muted)}
.heat .d{aspect-ratio:1;border-radius:6px;background:var(--heat0);font-size:.68rem;display:grid;place-items:center;color:var(--muted);max-width:100%}
.heat .d.l1{background:var(--heat1)} .heat .d.l2{background:var(--heat2)} .heat .d.l3{background:var(--heat3);color:var(--accent-fg)} .heat .d.l4{background:var(--heat4);color:var(--accent-fg)}
.heat .d.none{background:transparent;border:1px dashed var(--line)}
.heat .d.today{outline:2px solid var(--spark);outline-offset:1px}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.legend{display:flex;gap:4px;align-items:center;font-size:.72rem;color:var(--muted)}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
/* Logros */
.level{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.level b{font-family:var(--f-display);font-size:1.6rem}
.level .bar i{background:var(--spark)}
.badges{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.badge{border-radius:var(--r);padding:12px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:4px;min-width:0}
.badge .ico{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--muted);font-family:var(--f-display);font-size:.8rem}
.badge.on .ico{background:var(--spark);color:#1E1606}
.badge.off{opacity:.62}
.badge small{color:var(--muted);font-size:.78rem}
/* Formularios */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:.85rem;font-weight:600}
.field input[type=text],.field input[type=time],.field input[type=email],.field input[type=password],.field select{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:.85rem}
.days button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px}
.switch{display:flex;align-items:center;gap:10px}
.switch input{width:20px;height:20px;accent-color:var(--accent)}
.tpl{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px}
.tpl ul{margin:0;padding-left:18px;color:var(--muted);font-size:.9rem}
/* Perfil y mediciones */
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:.92rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.78rem;font-weight:600}
.pill.ok{background:var(--accent-soft);color:var(--ok)}
.pill.warn{background:var(--spark-soft);color:var(--warn)}
.pill.bad{background:transparent;color:var(--bad);border:1px solid currentColor}
.pill.idle{background:var(--surface-2);color:var(--muted)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.85rem;min-width:520px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
td.n{font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
textarea{width:100%;min-height:140px;font-family:var(--f-mono);font-size:.78rem;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;color:var(--fg)}
/* Tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:5}
.tabs .inner{display:grid;grid-template-columns:repeat(5,1fr);max-width:560px;width:100%}
.tabs button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;font-weight:600;color:var(--muted);padding:6px 2px;border-radius:10px}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--accent)}
/* Avisos */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));width:min(528px,calc(100% - 32px));background:var(--fg);color:var(--bg);border-radius:var(--r);padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;z-index:10;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast .btn{background:var(--bg);color:var(--fg)}
.toast .btn.primary{background:var(--accent);color:var(--accent-fg)}
.status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--muted)}
.status-dot.ok{background:var(--ok)} .status-dot.warn{background:var(--warn)} .status-dot.bad{background:var(--bad)}
@media (max-width:380px){.stats{grid-template-columns:1fr 1fr}.badges{grid-template-columns:1fr}}
/* Inicio de sesión */
.auth{min-height:calc(100dvh - 40px);display:flex;flex-direction:column;justify-content:center;gap:20px;padding-block:12px}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:52px;height:52px;flex:none}
.brand h1{font-size:1.6rem}
.auth .tag{color:var(--muted);margin:0;max-width:34ch}
.pw{position:relative}
.pw input{padding-right:84px!important}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--accent);font-weight:600;font-size:.85rem;padding:6px 8px;border-radius:8px}
.hint{font-size:.8rem;color:var(--muted)}
.err{color:var(--bad);font-size:.9rem;min-height:1.2em}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.8rem}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.btn.block{width:100%;padding:13px 16px}
.acct{display:flex;align-items:center;gap:12px}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--f-display);font-size:1rem;flex:none}
.acct .who{min-width:0}
.acct .who div{overflow-wrap:anywhere}
/* Animaciones */
.btn,.seg button,.days button,.tabs button,.check,.pw button{transition:transform .14s ease,background-color .2s ease,color .2s ease,border-color .2s ease}
.btn:active:not(:disabled),.seg button:active,.days button:active,.tabs button:active{transform:scale(.95)}
.tabs button[aria-current="page"] svg{transform:translateY(-2px);transition:transform .2s ease}
@keyframes enter{from{opacity:0;transform:translateX(var(--dx,0px))}to{opacity:1;transform:none}}
.app.enter{animation:enter .28s cubic-bezier(.2,.7,.2,1)}
@keyframes pop{0%{transform:scale(.8)}55%{transform:scale(1.14)}100%{transform:scale(1)}}
.check.pop{animation:pop .34s ease-out}
.check svg path{stroke-dasharray:24;stroke-dashoffset:0}
@keyframes draw{from{stroke-dashoffset:24}to{stroke-dashoffset:0}}
.check.pop svg path{animation:draw .32s ease-out}
.habit{transition:background-color .25s ease,border-color .25s ease}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
.streak b.bump{display:inline-block;animation:bump .5s ease-out}
.spark{position:fixed;width:7px;height:7px;border-radius:50%;pointer-events:none;z-index:40;animation:fly .65s ease-out forwards}
@keyframes fly{from{transform:translate(-50%,-50%) scale(1);opacity:1}to{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(.3);opacity:0}}
.celebrate{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));width:min(420px,calc(100% - 32px));z-index:30;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;gap:14px;align-items:center;box-shadow:0 14px 36px rgba(0,0,0,.2);transform:translateX(-50%);animation:cin .45s cubic-bezier(.2,.9,.3,1.25) both;cursor:pointer}
.celebrate.out{animation:cout .25s ease-in forwards}
@keyframes cin{from{opacity:0;transform:translate(-50%,-18px) scale(.92)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
@keyframes cout{to{opacity:0;transform:translate(-50%,-12px) scale(.96)}}
.medal{width:54px;height:54px;border-radius:50%;background:var(--spark);color:#1E1606;display:grid;place-items:center;font-family:var(--f-display);font-size:1.1rem;flex:none;animation:medal .65s .08s both}
.medal.lvl{background:var(--accent);color:var(--accent-fg)}
.medal svg{width:26px;height:26px}
@keyframes medal{0%{transform:scale(.3) rotate(-25deg)}60%{transform:scale(1.14) rotate(6deg)}100%{transform:scale(1) rotate(0)}}
.celebrate .t{font-weight:700}
.celebrate .s{font-size:.88rem;color:var(--muted)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.toast{animation:rise .22s ease-out}
.auth > *{animation:rise .4s ease-out both}
.auth > *:nth-child(2){animation-delay:.05s}.auth > *:nth-child(3){animation-delay:.1s}.auth > *:nth-child(4){animation-delay:.15s}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}
</style>

<main class="app" id="app" aria-live="polite"></main>
<div class="toast" id="toast" hidden></div>
<div id="fx" aria-live="polite"></div>
<nav class="tabs" aria-label="Secciones" id="nav"><div class="inner" id="tabs"></div></nav>

<script>
"use strict";
/* =====================================================================
   HabitFlow · MVP v2
   Módulos: 1) Fechas  2) Almacenamiento local  3) Reglas de negocio
            4) Gamificación  5) Mediciones (RNF)  6) Cuentas y cifrado
            7) Sincronización  8) Recordatorios  9) Animaciones  10) Vistas
   ===================================================================== */

const MAX_ACTIVOS = 5;          // RN-04
const DIAS_EDITABLES = 2;       // RN-02 (hoy + 2 días atrás)
const XP_CHECKIN = 10, XP_NIVEL = 100;
const PBKDF2_ITER = 150000;
const CATEGORIAS = ["Salud", "Ejercicio", "Mente", "Estudio", "Hogar", "Otro"];
const DOW = ["D", "L", "M", "X", "J", "V", "S"];
const DOW_LARGO = ["domingo", "lunes", "martes", "miércoles", "jueves", "viernes", "sábado"];
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];

/* ---------- 1) Fechas (siempre hora local del dispositivo) ---------- */
const pad = n => String(n).padStart(2, "0");
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fromKey = k => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (k, n) => { const d = fromKey(k); d.setDate(d.getDate() + n); return keyOf(d); };
const todayKey = () => keyOf(new Date());
const nowHMS = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; };
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);

/* ---------- 2) Almacenamiento local ---------- */
const SESSION_KEY = "habitflow:session";
const cacheKey = id => "habitflow:v2:cache:" + id;
function lsGet(k) { try { const r = localStorage.getItem(k); return r ? JSON.parse(r) : null; } catch { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } }
function lsDel(k) { try { localStorage.removeItem(k); } catch {} }
// Copia local del progreso del usuario con sesión (permite abrir sin internet)
function saveLocal() { if (Auth.session) lsSet(cacheKey(Auth.session.id), S); }
function emptyState() {
  return { v: 2, updatedAt: 0, profile: { name: "", email: "" }, habits: [], log: {}, badges: {}, usedTemplate: false, sample: false,
           metrics: { checkin: [], sync: [], load: [], render: [], reminder: [], login: [] } };
}
function normalize(x) {
  const s = Object.assign(emptyState(), JSON.parse(JSON.stringify(x || {})));
  s.metrics = Object.assign(emptyState().metrics, s.metrics || {});
  s.profile = Object.assign({ name: "", email: "" }, s.profile || {});
  return s;
}
let S = emptyState();

/* Cambia el estado, guarda local y agenda la sincronización. */
function commit() {
  S.updatedAt = Date.now();
  evaluateBadges();
  saveLocal();
  Sync.schedule();
  scheduleNative();
}

/* ---------- 3) Reglas de negocio ---------- */
function activeHabits() { return S.habits.filter(h => !h.archivedAt); }
function scheduledOn(k) {
  const dow = fromKey(k).getDay();
  return S.habits.filter(h => h.createdAt <= k && (!h.archivedAt || h.archivedAt > k) && h.days.includes(dow));
}
function isDone(k, id) { return !!(S.log[k] && S.log[k][id]); }
function dayStatus(k) {
  const sch = scheduledOn(k);
  return { total: sch.length, done: sch.filter(h => isDone(k, h.id)).length };
}
function firstDay() {
  if (!S.habits.length) return todayKey();
  return S.habits.reduce((m, h) => h.createdAt < m ? h.createdAt : m, todayKey());
}
// RN-01: un día suma solo si cumple el 100 % de lo programado; hoy no rompe la racha
// mientras no termine; los días sin hábitos programados ni suman ni rompen.
function currentStreak() {
  const today = todayKey(), start = firstDay();
  let n = 0;
  for (let k = today; k >= start; k = addDays(k, -1)) {
    const { total, done } = dayStatus(k);
    if (!total) continue;
    if (done === total) n++;
    else if (k === today) continue;
    else break;
  }
  return n;
}
function maxStreak() {
  const today = todayKey();
  let best = 0, run = 0;
  for (let k = firstDay(); k <= today; k = addDays(k, 1)) {
    const { total, done } = dayStatus(k);
    if (!total) continue;
    if (done === total) { run++; best = Math.max(best, run); }
    else if (k !== today) run = 0;
  }
  return best;
}
function perfectDays() {
  let n = 0; const today = todayKey();
  for (let k = firstDay(); k <= today; k = addDays(k, 1)) { const s = dayStatus(k); if (s.total && s.done === s.total) n++; }
  return n;
}
function totalCheckins() { return Object.values(S.log).reduce((a, d) => a + Object.keys(d).length, 0); }

/* ---------- 8) Recordatorios (dentro de la app) ---------- */
const reminded = new Set();
const snoozed = {};
function checkReminders() {
  if (screen !== "app") return;
  const k = todayKey(), now = new Date();
  const mins = now.getHours() * 60 + now.getMinutes();
  for (const h of scheduledOn(k)) {
    if (!h.remind || !h.time || isDone(k, h.id)) continue;
    const tag = k + h.id;
    if (reminded.has(tag)) continue;
    const [hh, mm] = h.time.split(":").map(Number);
    const due = snoozed[tag] || hh * 60 + mm;
    if (mins >= due && mins - due <= 120) {
      reminded.add(tag);
      if (!snoozed[tag]) {
        const sched = new Date(); sched.setHours(hh, mm, 0, 0);
        const delay = (now - sched) / 1000;
        if (delay >= 0 && delay < 600) { recordMetric("reminder", delay, { habit: h.name }); saveLocal(); }
      }
      showReminder(h, tag, mins);
      break;
    }
  }
}
function showReminder(h, tag, mins) {
  const t = document.getElementById("toast");
  t.replaceChildren(
    el("div", {}, el("b", {}, "Es hora de: "), h.name),
    el("div", { class: "row" },
      btn("Luego", "btn small", () => { snoozed[tag] = mins + 10; reminded.delete(tag); hideToast(); }),
      btn("Hecho", "btn small primary", (e) => { toggle(todayKey(), h.id, e); hideToast(); })));
  t.hidden = false;
  try { navigator.vibrate && navigator.vibrate([60, 40, 60]); } catch {}

}

  for (const [name, cat, time] of t.habits) {
    if (activeHabits().length >= MAX_ACTIVOS) break;
    S.habits.push({ id: uid(), name, cat, days: [0,1,2,3,4,5,6], time, remind: true, createdAt: todayKey(), archivedAt: null });
    added++;
  }
  S.usedTemplate = true;
  commit();
  showToast(added < t.habits.length ? `Se agregaron ${added} de ${t.habits.length}. El máximo es ${MAX_ACTIVOS} hábitos activos.` : `Rutina "${t.name}" agregada`);
  render();
  flushCelebrations(prev);
}

function habitForm(h) {
  const isNew = !h;
  const draft = h ? JSON.parse(JSON.stringify(h)) : { id: uid(), name: "", cat: "Salud", days: [1,2,3,4,5], time: "08:00", remind: true, createdAt: todayKey(), archivedAt: null };
  const name = el("input", { type: "text", id: "f-name", maxlength: "60", value: draft.name, placeholder: "Ej.: Leer 20 minutos", required: true });
  const cat = el("select", { id: "f-cat" }, CATEGORIAS.map(c => el("option", { value: c, selected: c === draft.cat }, c)));
  const time = el("input", { type: "time", id: "f-time", value: draft.time || "" });
  const remind = el("input", { type: "checkbox", id: "f-remind", checked: draft.remind });
  const days = el("div", { class: "days", role: "group", "aria-label": "Días de la semana" },
    [1,2,3,4,5,6,0].map(d => btn(DOW[d], "", (e) => {
      const i = draft.days.indexOf(d); if (i >= 0) draft.days.splice(i, 1); else draft.days.push(d);
      e.currentTarget.setAttribute("aria-pressed", String(draft.days.includes(d)));
    }, { "aria-pressed": String(draft.days.includes(d)), "aria-label": DOW_LARGO[d] })));
  const err = el("div", { class: "err" });
  const form = el("form", { class: "sheet", onsubmit: (e) => {
    e.preventDefault();
    draft.name = name.value.trim(); draft.cat = cat.value; draft.time = time.value; draft.remind = remind.checked;
    if (!draft.name) { err.textContent = "Escribe un nombre para el hábito."; name.focus(); return; }
    if (!draft.days.length) { err.textContent = "Elige al menos un día de la semana."; return; }
    if (isNew) S.habits.push(draft); else S.habits[S.habits.findIndex(x => x.id === draft.id)] = draft;
    editing = null; commit(); freshBadges = []; showToast(isNew ? "Hábito creado" : "Cambios guardados"); render();
  } },
    el("h2", {}, isNew ? "Nuevo hábito" : "Editar hábito"),
    el("div", { class: "field" }, el("label", { for: "f-name" }, "Nombre"), name),
    el("div", { class: "field" }, el("label", { for: "f-cat" }, "Categoría"), cat),
    el("div", { class: "field" }, el("span", { style: "font-size:.85rem;font-weight:600" }, "Días"), days),
    el("div", { class: "field" }, el("label", { for: "f-time" }, "Hora objetivo"), time),
    el("label", { class: "switch", for: "f-remind" }, remind, "Recordarme a esa hora"),
    err,
    el("div", { class: "row wrap" }, el("button", { type: "submit", class: "btn primary" }, isNew ? "Crear hábito" : "Guardar"), btn("Cancelar", "btn ghost", () => { editing = null; render(); })));
  setTimeout(() => name.focus(), 0);
  return form;
}

let confirmHabit = null;
function viewHabitos() {
  if (editing) return [habitForm(editing === "new" ? null : S.habits.find(h => h.id === editing))];
  const act = activeHabits(), arch = S.habits.filter(h => h.archivedAt);
  const full = act.length >= MAX_ACTIVOS;
  const removeHabit = (h) => {
    if (confirmHabit !== h.id) { confirmHabit = h.id; render(); setTimeout(() => { if (confirmHabit === h.id) { confirmHabit = null; if (tab === "habitos" && !editing) render(); } }, 4000); return; }
    confirmHabit = null;
    S.habits = S.habits.filter(x => x.id !== h.id);
    for (const k of Object.keys(S.log)) { delete S.log[k][h.id]; if (!Object.keys(S.log[k]).length) delete S.log[k]; }
    commit(); freshBadges = []; showToast("Hábito eliminado"); render();
  };
  const row = (h, archived) => el("div", { class: "habit" },
    el("div", { class: "info" }, el("div", { class: "name" }, h.name),
      el("div", { class: "meta" }, `${h.cat} · ${[1,2,3,4,5,6,0].filter(d => h.days.includes(d)).map(d => DOW[d]).join(" ")}${h.time ? " · " + h.time : ""}${h.remind ? " · con recordatorio" : ""}`)),
    el("div", { class: "row", style: "gap:6px;flex-wrap:wrap;justify-content:flex-end" },
      archived
        ? [btn("Reactivar", "btn small", () => { if (activeHabits().length >= MAX_ACTIVOS) { showToast(`Ya tienes ${MAX_ACTIVOS} hábitos activos. Archiva uno primero.`); return; } h.archivedAt = null; commit(); render(); }),
           btn(confirmHabit === h.id ? "Toca otra vez para borrar" : "Eliminar", "btn small danger", () => removeHabit(h))]
        : [btn("Editar", "btn small", () => { editing = h.id; render(); }), btn("Archivar", "btn small ghost", () => { h.archivedAt = todayKey(); commit(); render(); })]));
  return [
    topBanner(),
    el("div", { class: "row between" }, el("h1", {}, "Hábitos"), btn("+ Nuevo", "btn primary", () => { editing = "new"; render(); }, { disabled: full })),
    el("span", { class: "muted num", style: "font-size:.88rem" }, `${act.length} de ${MAX_ACTIVOS} hábitos activos${full ? ". Archiva uno para crear otro." : ""}`),
    act.length ? el("section", { class: "stack" }, act.map(h => row(h, false))) : el("div", { class: "empty" }, "Crea un hábito o agrega una rutina de abajo."),
    arch.length ? el("section", { class: "stack" }, el("h2", {}, "Archivados"), arch.map(h => row(h, true))) : null,
    el("section", { class: "stack" }, el("h2", {}, "Rutinas listas"),
      TEMPLATES.map(t => el("div", { class: "tpl" },
        el("div", { class: "row between wrap" }, el("strong", {}, t.name), btn("Agregar rutina", "btn small", () => addTemplate(t), { disabled: full })),
        el("span", { class: "muted", style: "font-size:.85rem" }, t.by),
        el("ul", {}, t.habits.map(x => el("li", {}, `${x[0]} (${x[2]})`))))))
  ];
}

function csvHabits() {
  const rows = [["fecha", "habito", "categoria", "cumplido", "hora_registro"]];
  const start = firstDay(), today = todayKey();
  for (let k = start; k <= today; k = addDays(k, 1))
    for (const h of scheduledOn(k)) rows.push([k, h.name, h.cat, isDone(k, h.id) ? "si" : "no", isDone(k, h.id) ? S.log[k][h.id] : ""]);
  return rows.map(r => r.map(v => /[",;\n]/.test(v) ? `"${String(v).replace(/"/g, '""')}"` : v).join(",")).join("\n");
}
function csvMetrics() {
  const rows = [["tipo", "rnf", "valor", "unidad", "fecha_hora", "detalle"]];
  for (const [type, g] of Object.entries(GOALS))
    for (const m of S.metrics[type] || []) rows.push([type, g.rnf, m.v, g.unit, m.at, m.net || m.accion || m.habit || ""]);
  return rows.map(r => r.join(",")).join("\n");
}
async function offerFile(filename, text) {
  try {
    if (window.claude && window.claude.use) {
      const dl = await window.claude.use("downloads");
      if (dl) { await dl.save({ filename, data: new Blob([text], { type: "text/csv" }) }); showToast("Archivo listo"); return; }
    } else {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([text], { type: "text/csv" })); a.download = filename; a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000); return;
    }
  } catch (e) { if (e && e.code === "declined") return; }
  csvOpen = { filename, text }; render();
}

function metricRow(type) {
  const g = GOALS[type], s = summary(type);
  const fmt = v => v == null ? "–" : (g.unit === "s" ? v.toFixed(1) : Math.round(v).toLocaleString("es-CO"));
  let pill = el("span", { class: "pill idle" }, "Sin datos");
  if (s.n) pill = s.p95 <= g.goal ? el("span", { class: "pill ok" }, "Cumple") : el("span", { class: "pill bad" }, "No cumple");
  return el("tr", {}, el("td", {}, g.rnf), el("td", {}, g.label), el("td", { class: "n" }, s.n), el("td", { class: "n" }, fmt(s.avg)), el("td", { class: "n" }, fmt(s.p95)),
    el("td", { class: "n" }, `≤ ${g.goal.toLocaleString("es-CO")} ${g.unit}`), el("td", {}, pill));
}

function viewPerfil() {
  const byNet = {};
  for (const m of S.metrics.sync || []) (byNet[m.net] || (byNet[m.net] = [])).push(m.v);
  const signed = !!Auth.session;
  const nameIn = el("input", { type: "text", id: "p-name", maxlength: "40", value: S.profile.name, placeholder: "Tu nombre" });
  return [
    topBanner(),
    el("h1", {}, "Perfil"),
    signed ? el("section", { class: "sheet" },
      el("div", { class: "acct" }, el("div", { class: "avatar", "aria-hidden": "true" }, (S.profile.name || "?").slice(0, 1).toUpperCase()),
        el("div", { class: "who" }, el("div", { style: "font-weight:700" }, S.profile.name || "Sin nombre"), el("div", { class: "muted", style: "font-size:.88rem" }, Auth.session.email))),
      el("form", { class: "stack", onsubmit: (e) => { e.preventDefault(); S.profile.name = nameIn.value.trim(); commit(); showToast("Nombre guardado"); render(); } },
        el("div", { class: "field" }, el("label", { for: "p-name" }, "Nombre"), nameIn),
        el("div", { class: "row wrap" }, el("button", { type: "submit", class: "btn primary small" }, "Guardar nombre"), btn("Cerrar sesión", "btn small ghost", () => logout("Cerraste sesión. Tu progreso quedó guardado."))))) :
      el("section", { class: "sheet" }, el("h2", {}, "Guarda tu progreso"), el("span", { class: "muted" }, "Crea una cuenta con tu correo para guardar tus hábitos y verlos desde cualquier celular."),
        el("div", { class: "row wrap" }, btn("Crear cuenta", "btn primary small", () => { screen = "auth"; authMode = "register"; authMsg = ""; render(); }), btn("Iniciar sesión", "btn small ghost", () => { screen = "auth"; authMode = "login"; authMsg = ""; render(); }))),
    el("section", { class: "sheet" },
      el("h2", {}, "Sincronización"),
      syncLine(),
      el("dl", { class: "kv" },
        el("dt", {}, "Hábitos activos"), el("dd", {}, activeHabits().length),
        el("dt", {}, "Check-ins guardados"), el("dd", {}, totalCheckins()),
        el("dt", {}, "Tipo de red detectada"), el("dd", {}, (navigator.connection && navigator.connection.effectiveType) || "no disponible"))),
    el("section", { class: "stack" },
      el("div", { class: "stack", style: "gap:4px" }, el("h2", {}, "Mediciones de requerimientos no funcionales"),
        el("span", { class: "muted", style: "font-size:.88rem" }, "La app mide sola cada check-in, sincronización, apertura, inicio de sesión, recordatorio y dibujo de Progreso. Se compara el percentil 95 (P95) con la meta.")),
      el("div", { class: "tbl-wrap" }, el("table", {},
        el("thead", {}, el("tr", {}, ["RNF", "Qué se mide", "n", "Promedio", "P95", "Meta", "Estado"].map(h => el("th", {}, h)))),
        el("tbody", {}, Object.keys(GOALS).map(metricRow)))),
      Object.keys(byNet).length ? el("span", { class: "muted", style: "font-size:.85rem" }, "Sincronización por red: " + Object.entries(byNet).map(([n, v]) => `${n}: ${v.length} medidas, P95 ${Math.round(pct(v, 95))} ms`).join(" · ")) : null,
      el("div", { class: "row wrap" },
        btn("Exportar mediciones (CSV)", "btn small", () => offerFile("habitflow-mediciones.csv", csvMetrics())),
        btn("Borrar mediciones", "btn small ghost", () => { S.metrics = emptyState().metrics; commit(); render(); }))),
    el("section", { class: "stack" }, el("h2", {}, "Mis datos"),
      el("div", { class: "row wrap" },
        btn("Exportar registros (CSV)", "btn small", () => offerFile("habitflow-registros.csv", csvHabits())),
        btn("Ver como texto", "btn small ghost", () => { csvOpen = { filename: "habitflow-registros.csv", text: csvHabits() }; render(); })),
      csvOpen ? el("div", { class: "stack" },
        el("label", { for: "csv-text", class: "muted", style: "font-size:.85rem" }, `${csvOpen.filename}: selecciona y copia el texto`),
        el("textarea", { id: "csv-text", readonly: true }, csvOpen.text),
        el("div", { class: "row wrap" },
          btn("Copiar", "btn small", async () => { const ta = document.getElementById("csv-text"); try { await navigator.clipboard.writeText(ta.value); showToast("Copiado"); } catch { ta.select(); } }),
          btn("Cerrar", "btn small ghost", () => { csvOpen = null; render(); }))) : null,
      signed ? el("div", { class: "row wrap" },
        btn(confirmWipe ? "Toca otra vez para reiniciar" : "Reiniciar mi progreso", "btn small danger", () => {
          if (!confirmWipe) { confirmWipe = true; render(); setTimeout(() => { confirmWipe = false; if (tab === "perfil") render(); }, 4000); return; }
          confirmWipe = false; const p = S.profile; S = emptyState(); S.profile = p; commit(); freshBadges = []; tab = "hoy"; showToast("Progreso reiniciado"); render();
        }),
        btn(confirmDelete ? "Toca otra vez para eliminar la cuenta" : "Eliminar mi cuenta", "btn small danger", async () => {
          if (!confirmDelete) { confirmDelete = true; render(); setTimeout(() => { confirmDelete = false; if (tab === "perfil") render(); }, 4000); return; }
          confirmDelete = false;
          try { await Backend.remove(Auth.session.id); Sync.pending = false; await logout("Tu cuenta y tu progreso fueron eliminados.", true); }
          catch (x) {
            if (x && x.code === "relogin") { Sync.pending = false; await logout("Tu progreso fue eliminado. Para borrar también el usuario, inicia sesión otra vez y toca Eliminar mi cuenta.", true); }
            else showToast("No se pudo eliminar la cuenta. Revisa tu internet.", 4000);
          }
        })) : null),
    el("p", { class: "muted", style: "font-size:.8rem;margin:0" }, Backend.mode === "firebase" ? "HabitFlow · MVP. Los cambios se guardan primero en el celular y luego se envían a Firebase (Firestore)." : "HabitFlow · prototipo MVP. Los cambios se guardan primero en el celular y luego se envían cifrados a la nube.")
  ];
}

const VIEWS = { hoy: viewHoy, progreso: viewProgreso, logros: viewLogros, habitos: viewHabitos, perfil: viewPerfil };
const TAB_INDEX = Object.fromEntries(TABS.map(([id], i) => [id, i]));
function render() {
  const app = document.getElementById("app");
  const view = screen === "app" ? tab : screen;
  app.replaceChildren(...(screen === "app" ? VIEWS[tab]() : screen === "auth" ? viewAuth() : []).filter(Boolean));
  document.getElementById("nav").hidden = screen !== "app";
  if (screen === "app") renderTabs();
  // Transición suave al cambiar de página
  if (renderedView && view !== renderedView && !REDUCED) {
    const dir = (TAB_INDEX[view] ?? 0) >= (TAB_INDEX[renderedView] ?? 0) ? 1 : -1;
    app.style.setProperty("--dx", screen === "app" && renderedView in TAB_INDEX ? dir * 16 + "px" : "0px");
    app.classList.remove("enter"); void app.offsetWidth; app.classList.add("enter");
  }
  renderedView = view;
  popId = null;
  // Anillo y barras animan desde su valor anterior
  requestAnimationFrame(() => requestAnimationFrame(() => {
    const r = document.getElementById("ringfg"); if (r) r.style.strokeDashoffset = r.dataset.to;
  }));
  if (screen === "app" && tab === "progreso" && lastRender != null) { const ms = lastRender; lastRender = null; afterPaint(() => { recordMetric("render", ms); saveLocal(); }); }
}

/* ---------- Arranque ---------- */
(async function boot() {
  Backend.init();
  if (await Auth.restore()) {
    const cached = lsGet(cacheKey(Auth.session.id));
    S = normalize(cached || emptyState());
    screen = "app";
    render();
    afterPaint(() => { recordMetric("load", performance.now()); saveLocal(); });
    // Trae la versión de la nube si es más reciente
    try {
      if (Backend.mode === "firebase") {
        await Backend.ready;
        const u = FB.auth.currentUser;
        if (!u || u.uid !== Auth.session.id) { await logout("Tu sesión terminó. Inicia sesión otra vez.", true); throw { code: "signed-out" }; }
      }
      const doc = await Backend.get(Auth.session.id);
      if (!doc) { if (Backend.mode === "firebase") { Sync.pending = true; Sync.flush(); } else if (Backend.isRemote()) await logout("Tu cuenta ya no existe en la nube. Crea una nueva o inicia sesión.", true); }
      else if ((doc.updatedAt || 0) > (S.updatedAt || 0)) { S = normalize(await Backend.unpack(doc)); saveLocal(); render(); }
      else if ((S.updatedAt || 0) > (doc.updatedAt || 0)) { Sync.pending = true; Sync.flush(); }
    } catch { /* sin conexión: se usa la copia del celular */ }
    if (Auth.session) Sync.start();
  } else {
    screen = "auth";
    render();
  }
  scheduleNative();
  checkReminders();
  setInterval(checkReminders, 15000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) { checkReminders(); if (screen === "app" && tab === "hoy") render(); } });
})();
</script>
